<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MH Mall</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>#map{height:58vh;min-height:320px;border-radius:14px}#sheet{display:none}.pic{font-size:3rem;text-align:center;background:var(--paper-dim);border-radius:12px;padding:12px}</style></head>
<body><div class="app-shell">
<div class="topbar"><div class="brand">🏬 MH Mall</div><div class="spacer"></div><span class="demo-badge" id="dbBadge">Demo</span></div>
<section class="screen active"><p class="muted">Tap a marker to see details, then open the dashboard.</p><div id="map"></div>
<div class="card" id="sheet"><div class="pic" id="sPic"></div><h2 id="sName"></h2><p class="muted" id="sDesc"></p><p><b id="sAvail"></b></p>
<button class="btn btn-primary" id="sOpen">Open</button></div></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="common.js"></script>
<script>
const $m=id=>document.getElementById(id);let tables=[],shows=[];
$m("dbBadge").textContent=FIREBASE_READY?"Live Sync":"Demo (offline)";
const P=[{k:"r",name:"SmartBite Restaurant",pic:"🍽️",desc:"Book a table, order by QR and pay from your phone.",url:"index.html",pos:[9.9252,78.1198]},
{k:"t",name:"MH Cinemas Theatre",pic:"🎬",desc:"Pick a show, choose seats, get a secure QR ticket and order snacks to your seat.",url:"theatre.html",pos:[9.9262,78.1212]}];
function avail(k){if(k==="r"){const a=tables.filter(t=>t.status==="available"&&Number.isInteger(t.number)).length;return a+" tables available now";}
const left=shows.reduce((s,x)=>s+40-(x.taken||[]).length,0);return shows.length?shows.length+" shows · "+left+" seats left":"Open to see today's shows";}
const map=L.map("map").setView([9.9257,78.1205],17);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let cur=null;
P.forEach(p=>L.marker(p.pos).addTo(map).bindTooltip(p.name).on("click",()=>{cur=p;show();map.panTo(p.pos);}));
function show(){if(!cur)return;$m("sheet").style.display="block";$m("sPic").textContent=cur.pic;$m("sName").textContent=cur.name;$m("sDesc").textContent=cur.desc;$m("sAvail").textContent=avail(cur.k);$m("sOpen").textContent="Open "+(cur.k==="r"?"Restaurant":"Theatre")+" Dashboard";$m("sOpen").onclick=()=>location.href=cur.url;}
dbListenAll("tables",r=>{tables=r;show();});dbListenAll("shows",r=>{shows=r;show();});
</script></body></html>
